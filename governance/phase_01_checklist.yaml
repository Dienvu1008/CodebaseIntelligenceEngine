    title: Benchmark harness skeleton, environment capture, benchmarks/fixtures.json with pinned SHAs (Zod, Requests, CodeForge-v2), results JSON schema
    status: pending
    check: "B-01/B-02/B-10/B-11 recorded for the small tier (no thresholds, NFR-066)"
  - id: P01-14
    title: Dogfood - index fixtures/*, Zod, Requests and CodeForge-v2 (read-only, --state-dir outside the fixture); export byte-identical across runs and OSes
