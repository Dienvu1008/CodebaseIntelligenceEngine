  - id: P01-11
    title: "Fitness: FF-DAT-001/002/004/005, FF-BND-003, FF-DEP-008 full per-adapter allow-list, FF-PRF-006 correctness"
    status: pending
    check: "governance/fitness.yaml entries ACTIVE with resolvable enforced_by"
  - id: P01-12
    title: Crash injection at each pipeline stage (SN-005) and adversarial config suite
    status: pending
