# Phase 01 checklist: Workspace and File Intelligence (IMPLEMENTATION_ROADMAP, Phase 01).
# Phase 01 closes when every item is done (or deferred, with a reason) and governance/phase.yaml moves to 2.
# From that point on, check-governance turns every missing Phase 01 invariant test into an error (C-11).
version: "1.0"
phase: 1
title: Workspace and File Intelligence
scope_rule: >
  Files and structure only (file, directory, package nodes) in immutable published revisions, with the
  full revision, lease and recovery machinery, plus a dev CLI. Excluded: symbol extraction, the graph
  beyond file/dir/package nodes, watcher, incremental indexing, JSON-RPC, LLM providers other than llm-none.

items:
  # --- Entry spike ---
  - id: P01-01
    title: "Spike S1: better-sqlite3 (exact pin) loads, opens a WAL DB and creates an FTS5 table on Node 24 and 26, win32-x64 and linux-x64 (A-02, A-03)"
    status: done
    check: "packages/adapters/test/sqlite/spike-s1.spec.ts green on the full CI matrix (commit 4c9ccc7); recorded as E-33 in ADR-0004 and ADR-0008"

  # --- Domain (core) ---
  - id: P01-02
    title: workspace domain - PathCanonicalizer (WS-002) with adversarial vectors (.., drive, UNC, \\?\, mixed separators, NFC, ADS, reserved names)
    status: done
    check: "tests/invariants/ws/ws-002.spec.ts (the adversarial path vectors live there)"
    notes: >
      (a) canonicalizePath with 43 vectors and a property test; (b, c) GuardedFileSystem realpath confinement,
      escaping directory links (junction on Windows) and file symlinks, root opened through a link.
  - id: P01-03
    title: workspace domain - IgnoreEvaluator (.gitignore semantics, CIE defaults, cie.config.json allow-list); matcher library choice recorded
    status: done
    check: "tests/oracles/ignore-evaluator.git-oracle.spec.ts (exact equality with git ls-files --others --exclude-standard, walk + point queries) and packages/core/test/ignore-evaluator.spec.ts"
    notes: >
      Decision (owner-approved): no matcher library. gitignore semantics are implemented in core with zero
      dependencies and checked against real git on the CI matrix. Four deliberate mutations (ancestor rule,
      globstar, CRLF, negation) were each caught by the oracle. Deliberate differences from git:
      case-sensitive on every OS (git on Windows defaults to core.ignorecase=true), and info/exclude plus
      core.excludesFile are not read (machine-local, would break WS-004). Layer order: CIE defaults <
      .gitignore (by depth) < cie.config.json. The config layer is wired to real settings in P01-08.
  - id: P01-04
    title: workspace domain - deterministic ManifestBuilder (UTF-16 code-unit order, manifestHash)
    status: done
    check: "tests/invariants/ws/ws-004.spec.ts (hand-written expected serialization; code-unit vs code-point vs locale order discriminated)"
    notes: Enumeration determinism (tree walk) is covered with GuardedFileSystem (P01-06) and the cross-OS export check (P01-14).
  - id: P01-05
    title: synchronization domain - IndexRevision, IndexJob, PublishPolicy, FreshnessEvaluator, RecoveryService
    status: pending
    check: "tests/invariants/sn/*.spec.ts"

  # --- Adapters ---
  - id: P01-06
    title: adapters/fs - GuardedFileSystem (realpath confinement, write confinement + SEC-002 exception register)
    status: done
    check: "tests/invariants/ws/ws-002.spec.ts (b, c); tests/invariants/sec/sec-002.spec.ts"
    notes: >
      Port refinement (allowed by the Phase 00 sign-off): FileSystem.readFile/list return Result (FS_OUTSIDE_ROOT,
      FS_NOT_FOUND, FS_NOT_A_FILE, FS_NOT_A_DIRECTORY, FS_IO_ERROR, FS_CANCELLED); list(null) lists the root.
      WriteConfinement checks real paths per purpose (state, wiki, init-gitignore, user-config) and refuses a
      --state-dir equal to, above or inside the workspace. Known limitation: realpath-then-read is a TOCTOU window
      against concurrent local attackers, which is outside the threat model (repository content is untrusted;
      local processes are not adversaries); to be recorded in the sign-off.
  - id: P01-07
    title: adapters/sqlite - open checks (quick_check, schema, meta.workspace_id), migrations framework, revision/lease/file/node tables, visibility-filter query builder, quarantine + rebuild
    status: pending
    check: "tests/invariants/ws/ws-003.spec.ts; tests/invariants/sn/sn-002,003,007; FF-DAT-001/002/004/005"
  - id: P01-08
    title: adapters/config - workspace allow-list + user config dir (SEC-005)
    status: pending
    check: "tests/invariants/sec/sec-005.spec.ts"

  # --- Runtime ---
  - id: P01-09
    title: runtime - composition root, llm-none default, startup recovery, dev CLI (cie dev index|status|export, --state-dir)
    status: pending
    check: "tests/invariants/ai/ai-004.spec.ts; CLI smoke test"

