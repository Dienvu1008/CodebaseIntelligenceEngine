  - id: P03-01
    title: "Entry: lang-ts builds a Program per project (plugins never enabled) and A-06 is re-verified for the Program path by extending tests/adversarial/lang-ts-plugins.spec.ts"
    status: done
    check: "tests/adversarial/lang-ts-plugins.spec.ts covers Program construction; EVIDENCE A-06 closed"
    notes: "adapters/lang-ts/program.ts: one Program per project over the snapshot-only VirtualWorkspace, noLib, types [], noEmit, no plugins; built and dropped one at a time. The adversarial test asserts an exact (checker-made) binding in the plugin-declaring project, mutation-checked. ADR-0016 'Phase 03 implementation'; EVIDENCE A-06."
  - id: P03-02
    title: "Carry-over: SY-003 span check at publish (RevisionValidator recomputes bounds for all symbols and a deterministic sample of span hashes, per DOMAIN_INVARIANTS), using the stored file line counts"
    status: done
    check: "tests/invariants/sy/sy-003.spec.ts gains a store-level case: a tampered range or span hash aborts publish"
    notes: "Schema v5 file.line_count, carried in CodeGraph.files and written by graph staging: completed in place only on rows introduced at the seq, else re-versioned (SN-007); a content-hash mismatch is refused. The RevisionValidator checks bounds in SQL for every symbol. IndexService rehashes a deterministic sample of the stored symbols (RevisionWriter.sampleSpans, every k-th by node id, default 200, spanSample null = all) from re-read bytes before decidePublish. A changed file is unverifiable, not a violation. Store-level (tampered range, tampered hash, shifted column) and pipeline (corrupting extractor) cases are mutation-checked. Full rehash on Zod 7059/7059, CodeForge-v2 6075/6075, Requests 1007/1007: no violations. The default sample costs ~0.4 s on CodeForge-v2 (measured under memory pressure). `dev index` prints the span stats."
  - id: P03-03
    title: "Carry-over: exact imports_symbol through the TypeChecker (re-exports, barrels, overloads, destructured require), replacing the Phase 02 heuristic binding for TS/JS"
    status: done
    check: "ground-truth js-mixed destructured-require gap closed; ts fixtures bindings exact"
    notes: "adapters/lang-ts/bindings.ts; extractor records destructured require names. All golden bindings exact, ground-truth KNOWN_GAPS now empty. Namespace bindings become module imports. Heuristic only as a fallback for files outside every Program. Zod 686/719 exact (rest: expression default exports, external namespaces), CodeForge-v2 1446/1446."

  # --- Domain (core) ---
  - id: P03-04
    title: knowledge domain - RelationType registry (KNOWLEDGE_GRAPH_DESIGN §3) with endpoint signatures and allowed statuses
    status: done
    check: "tests/invariants/kg/kg-002.spec.ts"
    notes: "core/knowledge/domain/relation-type.ts: 22 types with signatures, allowed statuses, occurrence flag (references, calls) and introducing phase; relationViolations. Compile-time coverage of CodeEdgeType and EdgeStatus. The RevisionValidator checks every visible edge (mutation-checked: without it, all three tampered cases publish). The test keeps the §3 table in sync with the registry and checks every golden export edge. §3 corrected: no file node kind; imports_symbol may target unresolved (status unknown). The relation_type table and FK come with P03-09. Also fixed FF-BND-002c: the Phase 00 rule wrongly forbade knowledge -> code-intelligence (allowed by C5); it is now one rule per source context, each with a violation fixture (ARCHITECTURE_FITNESS)."
  - id: P03-05
    title: knowledge domain - KnowledgeClaim, evidence (PV-003), claim status machine and ClaimVerifier capability token (PV-001, PV-002, AI-002)
    status: done
    notes: "knowledge/domain/{provenance,claim}.ts, verification/claim-verifier.ts. The token has a private constructor, an ECMAScript-private brand and a module-local mint, and binds one claim, its evidence set and the seq (no forgery or replay; tested by capturing a genuine token). qualifyingEvidence is the single PV-001 definition. ClaimVerifier is published only as @cie/core/verification. FF-BND-005 extended to dist and subpath forms; FF-BND-005b confines the capability to knowledge/** and runtime/src/composition/** (C8 revised: synchronization gets it injected). Guards mutation-checked (token genuineness, PV-001 evidence check, LLM actor guard). DOMAIN_MODEL §5 implementation notes."
    check: "tests/invariants/pv/pv-001.spec.ts, pv-002.spec.ts (incl. type-level), pv-003.spec.ts; FF-BND-005"
  - id: P03-06
    title: StalenessEvaluator (evidence content hash vs current revision); full propagation is Phase 05
    status: done
    notes: "knowledge/domain/staleness.ts: pure evaluation (changed evidence, freshness, DOMAIN_MODEL §5 fallback status: a verified claim without qualifying evidence falls back to inferred or unknown, an inferred claim with all evidence changed to unknown, user assertions never downgraded). KnowledgeClaim.applyFreshness applies it, bound to the claim and evidence set it was computed for. A stale verified claim returns to current only through ClaimVerifier (PV-004). packages/core/test/staleness.spec.ts, mutation-checked. Fallbacks the registry forbids (e.g. implements, verified only) surface as KG_002_CLAIM_INVALID; retraction is StalenessPropagation's decision in Phase 05."
    check: "unit tests; PV-004 groundwork"

