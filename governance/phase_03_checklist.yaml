# Phase 03 checklist: Knowledge Graph and Provenance (IMPLEMENTATION_ROADMAP, Phase 03).
# Phase 03 closes when every item is done (or deferred, with a reason) and governance/phase.yaml moves to 4.
version: "1.0"
phase: 3
title: Knowledge Graph and Provenance
scope_rule: >
  References, calls and type-relation edges (TS/JS L3 through the TypeScript compiler, Python L2 heuristics);
  knowledge claims, evidence and the claim status machine; the RelationType registry; bounded traversal read models
  and impact queries in the dev CLI. Excluded: documentation and wiki generation (Phase 04), incremental indexing
  and staleness propagation on change (Phase 05), LLM inference (Phase 07).

items:
