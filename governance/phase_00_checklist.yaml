# Phase 00 checklist: Architecture and Domain Baseline.
# Validated by scripts/check-governance.mjs (check: phase-checklists). Every item has a `check` that says
# how it is verified. Items with status: pending block the Phase 00 exit: once governance/phase.yaml moves
# to phase 1, check-governance fails while any item here is still pending.
version: "1.0"
phase: 0
title: Architecture and Domain Baseline
scope_rule: >
  Scaffold, governance wiring, domain primitive types and empty port interfaces ONLY.
  No adapter implementations, no SQLite, no tree-sitter, no file walking, no CLI, no JSON-RPC (NFR-044).
platform:
  ci_runners: [windows-latest, ubuntu-latest]
  node: ["24", "26"]          # ADR-0004
  macos: deferred
license:
  decision: open              # ADR-0013: do NOT create a LICENSE file
  manifests: { private: true, license: UNLICENSED }

items:
  # --- Repository scaffold ---
  - id: P00-01
    title: Root package.json with npm workspaces, engines.node ">=24 <27", private, license UNLICENSED
    status: done
    check: "tests/fitness/manifests.spec.ts"
  - id: P00-02
    title: .npmrc with save-exact=true and engine-strict=true; committed package-lock.json
    status: done
    check: "tests/fitness/manifests.spec.ts"
  - id: P00-03
    title: tsconfig.base.json (strict, NodeNext, noUncheckedIndexedAccess, exactOptionalPropertyTypes, verbatimModuleSyntax) + solution tsconfig.json
    status: done
    check: "npm run typecheck"
  - id: P00-04
    title: Packages protocol, core, adapters, runtime with src/index.ts and exports maps
    status: done
    check: "tests/fitness/exports.spec.ts"
  - id: P00-05
    title: core context folders (shared-kernel, workspace, code-intelligence, knowledge, documentation, synchronization, query) each with public.ts
    status: done
    check: "tests/fitness/depcruise-rules.spec.ts"

  # --- Domain primitives and ports (types only) ---
  - id: P00-06
    title: shared-kernel types (branded IDs, CanonicalPath type, SourceRange, ContentHash, Result, DomainError, Clock, Hasher, CancellationSignal)
    status: done
    check: "tests/fitness/shared-kernel.spec.ts + packages/core/test/shared-kernel.spec.ts"
  - id: P00-07
    title: Port interfaces for Phase 01 (FileSystem, ConfigSource, WorkspaceRepository, RevisionStore, RevisionWriter, LeaseManager, JobRepository, ChangeSource)
    status: done
    check: "npm run typecheck; tests/fitness/type-level.spec.ts"

  # --- Governance ---
  - id: P00-08
    title: Move docs/planning/governance/* to /governance (leave a pointer README), add fitness.yaml and shared-kernel.allowlist
    status: done
    check: "node scripts/check-governance.mjs"
  - id: P00-09
    title: scripts/check-governance.mjs (schema, test presence for phase <= current, ID no-removal vs base branch, md<->yaml parity, fitness register, allow-lists, checklists)
    status: done
    check: "tests/fitness/governance.spec.ts (good and bad fixtures)"
  - id: P00-10
    title: ESLint 9 flat config with boundary guards (FF-DEP-002/003/004/005, FF-CPX-001 warn, FF-CPX-005)
    status: done
    check: "npm run lint; tests/fitness/eslint-guards.spec.ts"
  - id: P00-11
    title: .dependency-cruiser.cjs per ARCHITECTURE_FITNESS section 4 plus one violation fixture per rule
    status: done
    check: "tests/fitness/depcruise-rules.spec.ts"
  - id: P00-12
    title: ArchUnitTS trial and adopt/reject decision recorded (OQ-10)
    status: done
    check: "manual: decision recorded in ARCHITECTURE_FITNESS §1 and governance/fitness.yaml FF-CPX-002 (not adopted; depcruise --metrics)"

  # --- CI ---
  - id: P00-13
    title: CI workflows governance, dependency-direction, test (matrix windows/ubuntu x Node 24/26)
    status: done
    check: "CI green on all matrix cells for commit d06a1da on branch phase-00 (reported by the project owner, 2026-10-31)"
  - id: P00-14
    title: Exact dependency versions selected via npm view and recorded below (pinned_versions)
    status: done
    check: "manual review; tests/fitness/manifests.spec.ts enforces exact specs"

# Selected 2026-10-31 via `npm view`. Deviations from "latest" are explained.
pinned_versions:
  typescript: "6.0.3"            # latest is 7.0.2; typescript-eslint 8.72.1 requires typescript <6.1.0 (E-32)
  vitest: "5.0.5"
  eslint: "9.39.5"               # ESLint 9 kept (OQ-08); typescript-eslint also supports ESLint 10
  "@eslint/js": "9.39.5"
  typescript-eslint: "8.72.1"
  dependency-cruiser: "18.7.0"
  ajv: "8.20.0"
  js-yaml: "5.5.0"               # ships its own types; @types/js-yaml not needed
  "@types/node": "24.19.2"
  github_actions: { checkout: v7, setup-node: v7 }
  not_installed_yet: [fast-check]  # property-based tests start in Phase 01

fitness_functions_active:
  [FF-DEP-001, FF-DEP-002, FF-DEP-003, FF-DEP-004, FF-DEP-005, FF-DEP-006, FF-DEP-007, FF-DEP-008,
   FF-BND-001, FF-BND-002, FF-BND-005, FF-BND-007, FF-CPX-001, FF-CPX-004, FF-CPX-005, FF-DAT-007]

invariants_due: []    # no domain invariant has phase 0; Phase 01 is the first invariant gate

known_issues:
  - "npm audit: 11 moderate findings, all through minimatch in the ESLint dev toolchain (DoS via glob patterns). Dev-only and not shipped; tracked under T11. Re-check at each phase sign-off."

exit_criteria:
  - "npm run verify (typecheck, lint, depcruise, test, governance) green on all CI matrix cells"
  - "every FF rule listed above fires on its violation fixture"
  - "no file outside the scope_rule was added (reviewed in sign-off)"
  - "docs/phases/PHASE_00_SIGNOFF.md written with evidence and deferred items"
