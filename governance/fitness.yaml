  - id: FF-DEP-001
    title: No circular dependencies
    phase: 0
    blocking: true
    status: ACTIVE
    enforced_by: ["depcruise:FF-DEP-001-no-circular", "test:tests/fitness/depcruise-rules.spec.ts"]
