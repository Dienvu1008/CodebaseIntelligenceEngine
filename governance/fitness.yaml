    enforced_by: ["depcruise:FF-DEP-006-protocol-is-leaf", "test:tests/fitness/manifests.spec.ts"]
  - id: FF-DEP-007
    title: node:child_process only in adapters/process and packages/client
    phase: 0
    blocking: true
    status: ACTIVE
    enforced_by: ["depcruise:FF-DEP-007-child-process-confined"]
  - id: FF-DEP-008
    title: Third-party allow-list per adapter subfolder (storage drivers enforced from Phase 00)
    phase: 1
    blocking: true
    status: ACTIVE
    enforced_by: ["depcruise:FF-DEP-008-sqlite-confined", "depcruise:FF-DEP-008b-treesitter-confined", "depcruise:FF-DEP-008c-typescript-runtime-confined", "depcruise:FF-DEP-008d-llm-sdk-confined", "depcruise:FF-DEP-008e-mcp-sdk-confined"]
    notes: Full per-adapter allow-list (DEPENDENCY_RULES §4 A2 and §5) since Phase 01.
