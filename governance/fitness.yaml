# CIE fitness function register: the machine-readable mirror of docs/planning/ARCHITECTURE_FITNESS.md §3.
# Validated by scripts/check-governance.mjs. For every ACTIVE entry, each `enforced_by` reference must exist:
#   depcruise:<rule name>   a rule with that exact name in .dependency-cruiser.cjs
#   eslint:<rule id>        configured in eslint.config.js (spelled out for traceability)
#   test:<path>             the test file must exist
#   governance:<check>      a check implemented by scripts/check-governance.mjs
# Status is ACTIVE (enforced now) or PLANNED (introduced in `phase`).
version: "1.0"
fitness_functions:
