version: "1.0"
phase: 2
title: Multi-language Symbol Extraction
scope_rule: >
  Symbols, spans, fingerprints and imports for TS/TSX/JS (tree-sitter + TypeScript module resolution) and Python
  (tree-sitter + deterministic import heuristics), with capability profiles. Excluded: references, calls and type
  relations (Phase 03); incremental indexing (Phase 05); Dart.

